<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quranfy+ | Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-arabic { font-family: 'Amiri', serif; }
        .active-card { border-right: 4px solid var(--primary); background: #f8fafc; transition: all 0.3s; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="pb-40 bg-slate-50 text-slate-800">

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm px-5 py-4 flex justify-between items-center border-b border-slate-200">
        <div class="flex items-center gap-3">
            <button id="btn-back" onclick="showHome()" class="hidden p-2 bg-white shadow-sm border border-slate-200 hover:bg-slate-50 rounded-xl active:scale-90 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h1 class="text-lg font-bold text-blue-700">Quranfy+</h1>
        </div>
        <div id="tab-switcher" class="hidden flex p-1 rounded-xl bg-slate-100 border border-slate-200 text-[10px] font-bold">
            <button onclick="switchMode('ayat')" id="tab-ayat" class="px-4 py-1.5 rounded-lg bg-white shadow-sm text-blue-600 font-bold">AYAT</button>
            <button onclick="switchMode('tafsir')" id="tab-tafsir" class="px-4 py-1.5 rounded-lg font-bold">TAFSIR</button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-5">
        <div id="search-section" class="mb-6">
            <input type="text" id="search-input" oninput="filterSurah(this.value)" placeholder="Cari Surat..." class="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-all">
        </div>
        <div id="main-content" class="space-y-4">
            <p class="text-center py-10 opacity-50 text-sm animate-pulse">Memuat Daftar Surah...</p>
        </div>
    </main>

    <div id="player-bar" class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 px-6 py-5 translate-y-full transition-transform duration-500 z-50 rounded-t-3xl shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)]">
        <div class="max-w-2xl mx-auto flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <div class="min-w-0 flex-1">
                    <p id="p-surah" class="font-bold text-xs truncate text-slate-800">Pilih Ayat</p>
                    <p id="p-mode-label" class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Mode Ayat</p>
                </div>
                <select id="qari-select" onchange="updateQari(this.value)" class="bg-slate-50 text-[10px] font-bold text-blue-600 outline-none p-1.5 rounded-lg border border-slate-200 max-w-[180px]">
                </select>
            </div>

            <div class="flex flex-col gap-1">
                <input type="range" id="p-slider" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" value="0">
                <div class="flex justify-between text-[9px] font-mono text-slate-500">
                    <span id="p-current">0:00</span>
                    <span id="p-total">0:00</span>
                </div>
            </div>
            
            <div class="flex items-center justify-center gap-8">
                <button onclick="prevAyat()" class="p-3 bg-white shadow-sm border border-slate-200 hover:bg-slate-50 rounded-full text-blue-600 transition-all">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button id="p-main-btn" onclick="togglePlay()" class="p-5 bg-blue-600 text-white shadow-md hover:bg-blue-700 hover:shadow-lg rounded-full transition-all">
                    <svg id="svg-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="svg-pause" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button onclick="nextAyat()" class="p-3 bg-white shadow-sm border border-slate-200 hover:bg-slate-50 rounded-full text-blue-600 transition-all">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_MAIN = "https://equran.id/api/v2";
        const API_BACKUP = "https://quran-api-id.vercel.app/api/v2"; 
        const EVERYAYAH_BASE = "https://everyayah.com/data";
        
        let currentAPI = API_MAIN;
        let store = { all: [], surah: null, tafsir: null, qari: 'ea_Alafasy_128kbps', idx: -1, mode: 'ayat', audio: new Audio() };

        const everyAyahQaris = [
            { id: "ea_Alafasy_128kbps", name: "Mishary Rashid Alafasy" },
            { id: "ea_Abdul_Basit_Murattal_128kbps", name: "Abdul Basit Murattal" },
            { id: "ea_AbdulSamad_64kbps_QuranExplorer.Com", name: "Abdul Samad" },
            { id: "ea_Abdurrahmaan_As-Sudais_128kbps", name: "Abdurrahman As-Sudais" },
            { id: "ea_Abu_Bakr_Ash-Shaatree_64kbps", name: "Abu Bakr Al Shatri" },
            { id: "ea_Ahmed_ibn_Ali_al-Ajamy_128kbps_ketaballah.net", name: "Ahmed Al-Ajamy (Ketaballah)" },
            { id: "ea_ahmed_ibn_ali_al_ajamy_128kbps", name: "Ahmed Al-Ajamy" },
            { id: "ea_Ali_Hajjaj_AlSuesy_128kbps", name: "Ali Hajjaj AlSuesy" },
            { id: "ea_Ayman_Sowaid_64kbps", name: "Ayman Sowaid" },
            { id: "ea_aziz_alili_128kbps", name: "Aziz Alili" },
            { id: "ea_Fares_Abbad_64kbps", name: "Fares Abbad" },
            { id: "ea_Ghamadi_40kbps", name: "Saad Al-Ghamdi" },
            { id: "ea_Hani_Rifai_192kbps", name: "Hani Ar-Rifai" },
            { id: "ea_Husary_128kbps", name: "Mahmoud Khalil Al-Husary" },
            { id: "ea_Husary_Mujawwad_128kbps", name: "Al-Husary Mujawwad" },
            { id: "ea_Ibrahim_Akhdar_32kbps", name: "Ibrahim Al-Akhdar" },
            { id: "ea_khalefa_al_tunaiji_64kbps", name: "Khalifa Al-Tunaiji" },
            { id: "ea_MaherAlMuaiqly128kbps", name: "Maher Al-Muaiqly" },
            { id: "ea_Mahmud_Al_Busairi_64kbps", name: "Mahmud Al Busairi" },
            { id: "ea_Minshawy_Mujawwad_64kbps", name: "Al-Minshawi Mujawwad" },
            { id: "ea_Minshawy_Murattal_128kbps", name: "Al-Minshawi Murattal" },
            { id: "ea_Mohammad_al_Tablaway_128kbps", name: "Mohammad Al-Tablawi" },
            { id: "ea_Muhammad_AbdulKareem_128kbps", name: "Muhammad AbdulKareem" },
            { id: "ea_Muhammad_Ayyoub_128kbps", name: "Muhammad Ayyub" },
            { id: "ea_Muhammad_Jibreel_128kbps", name: "Muhammad Jibril" },
            { id: "ea_muhammad_jibreel_128kbps", name: "Muhammad Jibril Alt" },
            { id: "ea_Muhsin_Al_Qasim_192kbps", name: "Abdul Muhsin Al-Qasim" },
            { id: "ea_Nabil_Rifa3i_48kbps", name: "Nabil Ar-Rifai" },
            { id: "ea_Nasser_Alqatami_128kbps", name: "Nasser Al-Qatami" },
            { id: "ea_Parhizgar_48kbps", name: "Shahriar Parhizgar" },
            { id: "ea_Sahl_Yassin_128kbps", name: "Sahl Yassin" },
            { id: "ea_Salaah_AbdulRahman_Bukhatir_128kbps", name: "Salah Bukhatir" },
            { id: "ea_Saood_ash-Shuraym_128kbps", name: "Saoud As-Shuraim" },
            { id: "ea_Yasser_Ad-Dussary_128kbps", name: "Yasser Al-Dosari" }
        ];

        const equranQariMap = {
            "01": "EQuran - Abdullah Al-Juhany",
            "02": "EQuran - Abdul Muhsin Al-Qasim",
            "03": "EQuran - Abdurrahman As-Sudais",
            "04": "EQuran - Ibrahim Al-Dossari",
            "05": "EQuran - Mishary Rashid Al-Afasy"
        };

        window.onload = () => { fetchList(); initAudioListeners(); };

        async function customFetch(endpoint) {
            try {
                const res = await fetch(`${currentAPI}${endpoint}`);
                if (!res.ok) throw new Error();
                return await res.json();
            } catch (err) {
                if (currentAPI === API_MAIN) {
                    currentAPI = API_BACKUP;
                    const res = await fetch(`${currentAPI}${endpoint}`);
                    return await res.json();
                }
                throw err;
            }
        }

        async function fetchList() {
            try {
                const json = await customFetch("/surat");
                store.all = json.data;
                renderHome(store.all);
            } catch (err) {
                document.getElementById('main-content').innerHTML = "<p class='text-center py-10 text-red-500 font-bold'>Gagal memuat data surat.</p>";
            }
        }

        function buildQariDropdown(isFullSurah = false) {
            const select = document.getElementById('qari-select');
            let options = "";

            if (isFullSurah) {
                for (let key in equranQariMap) {
                    const val = 'eq_' + key;
                    options += `<option value="${val}" ${store.qari === val ? 'selected' : ''}>${equranQariMap[key]}</option>`;
                }
            } else {
                everyAyahQaris.forEach(q => {
                    options += `<option value="${q.id}" ${store.qari === q.id ? 'selected' : ''}>${q.name}</option>`;
                });
                for (let key in equranQariMap) {
                    const val = 'eq_' + key;
                    options += `<option value="${val}" ${store.qari === val ? 'selected' : ''}>${equranQariMap[key]}</option>`;
                }
            }
            select.innerHTML = options;
        }

        function renderHome(data) {
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('tab-switcher').classList.add('hidden');
            document.getElementById('search-section').classList.remove('hidden');
            const html = data.map(s => `
                <div onclick="loadDetail(${s.nomor})" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:shadow-md hover:border-slate-200 flex justify-between items-center active:scale-95 transition-all cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-[10px] font-bold text-blue-600">${s.nomor}</div>
                        <div>
                            <h3 class="font-bold text-sm text-slate-800">${s.namaLatin}</h3>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">${s.arti} • ${s.jumlahAyat} Ayat</p>
                        </div>
                    </div>
                    <p class="font-arabic text-2xl text-blue-600 font-bold">${s.nama}</p>
                </div>
            `).join('');
            document.getElementById('main-content').innerHTML = html || "<p class='text-center py-10 opacity-50 text-sm'>Surat tidak ditemukan.</p>";
        }

        async function loadDetail(no) {
            document.getElementById('main-content').innerHTML = "<p class='text-center py-10 opacity-50 text-sm animate-pulse'>Memuat Kalamullah...</p>";
            try {
                const [jsonS, jsonT] = await Promise.all([ customFetch(`/surat/${no}`), customFetch(`/tafsir/${no}`) ]);
                store.surah = jsonS.data;
                store.tafsir = jsonT.data;
                buildQariDropdown(false); 
                renderDetail();
            } catch (err) {
                document.getElementById('main-content').innerHTML = "<p class='text-center py-10 text-red-500 font-bold'>Gagal memuat detail surat.</p>";
            }
        }

        function renderDetail() {
            document.getElementById('btn-back').classList.remove('hidden');
            document.getElementById('tab-switcher').classList.remove('hidden');
            document.getElementById('search-section').classList.add('hidden');
            
            const s = store.surah;
            let header = `
                <div class="p-8 rounded-3xl bg-white shadow-sm border border-slate-100 text-center mb-8">
                    <h2 class="font-arabic text-4xl text-blue-600 mb-2 font-bold">${s.nama}</h2>
                    <h3 class="font-bold text-xl">${s.namaLatin}</h3>
                    <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest">${s.tempatTurun} • ${s.arti}</p>
                    
                    <div class="mt-4 text-[10px] text-slate-500 leading-relaxed line-clamp-3 text-justify px-2" id="desc-text">
                        ${s.deskripsi}
                    </div>
                    <button onclick="toggleDesc()" id="btn-desc" class="mt-2 text-[9px] font-bold text-blue-500 uppercase tracking-widest">Selengkapnya</button>
                    
                    <div class="mt-6">
                        <button onclick="playFull()" class="px-8 py-3 rounded-full bg-blue-600 text-white text-[10px] font-bold shadow-lg hover:bg-blue-700 hover:shadow-xl active:scale-95 transition-all">PUTAR FULL SURAT</button>
                    </div>
                </div>
            `;

            let ayatHtml = `<div id="view-ayat" class="space-y-5">`;
            s.ayat.forEach((a, i) => {
                ayatHtml += `
                    <div id="ayat-${i}" class="p-6 rounded-2xl bg-white shadow-sm border border-slate-100 transition-all">
                        <div class="flex justify-between items-center mb-5">
                            <span class="text-[9px] font-bold text-slate-400 bg-slate-50 px-3 py-1 rounded-full border border-slate-100">AYAT ${a.nomorAyat}</span>
                            <div class="flex gap-2">
                                <button onclick="shareWA(${i})" class="p-2 bg-white shadow-sm border border-slate-100 hover:bg-slate-50 rounded-lg transition-colors">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
                                </button>
                                <button onclick="playAyat(${i})" class="p-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg transition-colors">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                </button>
                            </div>
                        </div>
                        <p class="text-right font-arabic text-3xl leading-[2.8] mb-4 font-bold text-slate-800">${a.teksArab}</p>
                        <p class="text-blue-600 text-[11px] font-semibold mb-2">${a.teksLatin}</p>
                        <p class="text-slate-500 text-[11px] leading-relaxed">${a.teksIndonesia}</p>
                    </div>
                `;
            });
            ayatHtml += "</div>";

            let tafsirHtml = `<div id="view-tafsir" class="hidden space-y-5">`;
            store.tafsir.tafsir.forEach((t, i) => {
                tafsirHtml += `
                    <div class="p-6 rounded-2xl bg-white shadow-sm border border-slate-100">
                        <p class="text-[10px] font-bold text-blue-600 mb-3 uppercase tracking-widest bg-blue-50 inline-block px-3 py-1 rounded-full">Tafsir Ayat ${t.ayat}</p>
                        <p id="t-text-${i}" class="text-slate-600 text-xs leading-relaxed line-clamp-3">${t.teks}</p>
                        <button onclick="toggleTafsir(${i})" id="t-btn-${i}" class="mt-3 text-[10px] font-bold text-blue-500 uppercase">Selengkapnya</button>
                    </div>
                `;
            });
            tafsirHtml += "</div>";

            document.getElementById('main-content').innerHTML = header + ayatHtml + tafsirHtml;
            switchMode(store.mode);
        }

        function toggleDesc() {
            const el = document.getElementById('desc-text');
            const btn = document.getElementById('btn-desc');
            const isClamped = el.classList.toggle('line-clamp-3');
            btn.innerText = isClamped ? "Selengkapnya" : "Sembunyikan";
        }

        function toggleTafsir(i) {
            const el = document.getElementById(`t-text-${i}`);
            const btn = document.getElementById(`t-btn-${i}`);
            const isClamped = el.classList.toggle('line-clamp-3');
            btn.innerText = isClamped ? "Selengkapnya" : "Sembunyikan";
        }

        function switchMode(m) {
            store.mode = m;
            document.getElementById('view-ayat').classList.toggle('hidden', m !== 'ayat');
            document.getElementById('view-tafsir').classList.toggle('hidden', m !== 'tafsir');
            document.getElementById('tab-ayat').className = m === 'ayat' ? 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-blue-600 font-bold' : 'px-4 py-1.5 rounded-lg font-bold';
            document.getElementById('tab-tafsir').className = m === 'tafsir' ? 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-blue-600 font-bold' : 'px-4 py-1.5 rounded-lg font-bold';
        }

        function initAudioListeners() {
            const s = document.getElementById('p-slider');
            store.audio.ontimeupdate = () => {
                if(!isNaN(store.audio.duration)) {
                    s.value = (store.audio.currentTime / store.audio.duration) * 100;
                    document.getElementById('p-current').innerText = formatTime(store.audio.currentTime);
                    document.getElementById('p-total').innerText = formatTime(store.audio.duration);
                }
            };
            s.oninput = () => store.audio.currentTime = (s.value / 100) * store.audio.duration;
            store.audio.onended = () => {
                if(store.idx !== -1 && store.idx < store.surah.ayat.length-1) nextAyat();
                else updatePlayBtn(false);
            };
        }

        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0'+s : s}`;
        }

        function playAyat(idx) {
            store.idx = idx;
            buildQariDropdown(false); 

            const sNo = String(store.surah.nomor).padStart(3, '0');
            const aNo = String(store.surah.ayat[idx].nomorAyat).padStart(3, '0');
            let audioUrl = "";

            if(store.qari.startsWith('ea_')) {
                const folderQari = store.qari.replace('ea_', '');
                audioUrl = `${EVERYAYAH_BASE}/${folderQari}/${sNo}${aNo}.mp3`;
            } else {
                const qKey = store.qari.replace('eq_', '').padStart(2, '0');
                audioUrl = store.surah.ayat[idx].audio[qKey];
            }

            startAudio(audioUrl, `${store.surah.namaLatin} : ${store.surah.ayat[idx].nomorAyat}`, "Mode Ayat");
            
            document.querySelectorAll('.active-card').forEach(el => el.classList.remove('active-card'));
            const card = document.getElementById(`ayat-${idx}`);
            if(card) { card.classList.add('active-card'); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }

        function playFull() {
            store.idx = -1;
            if (store.qari.startsWith('ea_')) {
                store.qari = "eq_01";
            }
            buildQariDropdown(true); 

            const qKey = store.qari.replace('eq_', '').padStart(2, '0');
            startAudio(store.surah.audioFull[qKey], store.surah.namaLatin, "Full Surat");
        }

        function startAudio(url, title, mode) {
            store.audio.src = url;
            store.audio.play();
            document.getElementById('p-surah').innerText = title;
            document.getElementById('p-mode-label').innerText = mode;
            document.getElementById('player-bar').classList.remove('translate-y-full');
            updatePlayBtn(true);
        }

        function updateQari(v) { 
            store.qari = v; 
            if(!store.audio.paused) {
                store.idx === -1 ? playFull() : playAyat(store.idx); 
            }
        }

        function togglePlay() {
            if(store.audio.paused) { store.audio.play(); updatePlayBtn(true); }
            else { store.audio.pause(); updatePlayBtn(false); }
        }

        function updatePlayBtn(playing) {
            document.getElementById('svg-play').classList.toggle('hidden', playing);
            document.getElementById('svg-pause').classList.toggle('hidden', !playing);
        }

        /* Fungsi navigasi dan share WhatsApp */
        function nextAyat() { if(store.idx !== -1 && store.idx < store.surah.ayat.length-1) playAyat(store.idx + 1); }
        function prevAyat() { if(store.idx > 0) playAyat(store.idx - 1); }
        function showHome() {
            document.getElementById('search-input').value = '';
            store.audio.pause();
            document.getElementById('player-bar').classList.add('translate-y-full');
            renderHome(store.all);
            window.scrollTo(0,0);
        }
        function filterSurah(v) { renderHome(store.all.filter(s => s.namaLatin.toLowerCase().includes(v.toLowerCase()))); }
        function shareWA(idx) {
            const a = store.surah.ayat[idx];
            const msg = encodeURIComponent(`*${store.surah.namaLatin} Ayat ${a.nomorAyat}*\n\n${a.teksArab}\n\n"${a.teksIndonesia}"`);
            window.open(`https://wa.me/?text=${msg}`);
        }
    </script>
</body>
</html>
